apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudvision
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cloudvision
  template:
    metadata:
      labels:
        app: cloudvision
    spec:
      containers:
        - name: cloudvision-api
          image: cloudvision-api:dev
          imagePullPolicy: Never
          ports:
            - containerPort: 8000
          resources:
            requests:
              memory: "1Gi"
              cpu: "250m"
            limits:
              memory: "4Gi"
              cpu: "2"
---
apiVersion: v1
kind: Service
metadata:
  name: cloudvision-service
spec:
  type: ClusterIP
  selector:
    app: cloudvision
  ports:
    - port: 8000
      targetPort: 8000